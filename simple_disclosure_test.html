<!DOCTYPE html>
<html>
<head>
    <title>投稿审查页面测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-btn { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .result { margin: 20px 0; padding: 15px; border-radius: 5px; white-space: pre-wrap; font-family: monospace; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
    </style>
</head>
<body>
    <h1>投稿审查页面API测试</h1>
    
    <div>
        <button class="test-btn" onclick="login()">管理员登录</button>
        <button class="test-btn" onclick="testPending()">测试待审核投稿</button>
        <button class="test-btn" onclick="testPublic()">测试已公开投稿</button>
        <button class="test-btn" onclick="testBoth()">测试所有投稿</button>
    </div>
    
    <div id="result" class="result" style="display:none;"></div>

    <script>
        let token = '';

        async function login() {
            showResult('正在登录...', 'info');
            try {
                const response = await fetch('http://localhost:9090/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'testuser3', password: '123123' })
                });
                const data = await response.json();
                if (data.code === 200) {
                    token = data.data.token;
                    showResult(`✅ 登录成功\nToken: ${token.substring(0, 30)}...`, 'success');
                } else {
                    showResult(`❌ 登录失败: ${data.msg}`, 'error');
                }
            } catch (error) {
                showResult(`❌ 网络错误: ${error.message}`, 'error');
            }
        }

        async function testPending() {
            if (!token) { alert('请先登录'); return; }
            showResult('正在测试待审核投稿...', 'info');
            try {
                const response = await fetch('http://localhost:9090/disclosure/queryPendingList', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ pageNum: 1, pageSize: 100 })
                });
                const data = await response.json();
                const count = data.data?.length || 0;
                showResult(`✅ 待审核投稿API正常
数量: ${count}

数据示例:
${JSON.stringify(data.data?.[0] || {}, null, 2)}`, 'success');
            } catch (error) {
                showResult(`❌ 测试失败: ${error.message}`, 'error');
            }
        }

        async function testPublic() {
            if (!token) { alert('请先登录'); return; }
            showResult('正在测试已公开投稿...', 'info');
            try {
                const response = await fetch('http://localhost:9090/disclosure/queryPublicList', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ pageNum: 1, pageSize: 100 })
                });
                const data = await response.json();
                const count = data.data?.length || 0;
                showResult(`✅ 已公开投稿API正常
数量: ${count}

数据示例:
${JSON.stringify(data.data?.[0] || {}, null, 2)}`, 'success');
            } catch (error) {
                showResult(`❌ 测试失败: ${error.message}`, 'error');
            }
        }

        async function testBoth() {
            if (!token) { alert('请先登录'); return; }
            showResult('正在测试所有投稿...', 'info');
            try {
                const [pendingRes, publicRes] = await Promise.all([
                    fetch('http://localhost:9090/disclosure/queryPendingList', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ pageNum: 1, pageSize: 100 })
                    }),
                    fetch('http://localhost:9090/disclosure/queryPublicList', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ pageNum: 1, pageSize: 100 })
                    })
                ]);
                
                const pendingData = await pendingRes.json();
                const publicData = await publicRes.json();
                
                const pendingCount = pendingData.data?.length || 0;
                const publicCount = publicData.data?.length || 0;
                const totalCount = pendingCount + publicCount;
                
                showResult(`📊 投稿数据统计:
待审核: ${pendingCount} 条
已公开: ${publicCount} 条
总计: ${totalCount} 条

待审核示例:
${JSON.stringify(pendingData.data?.[0] || {}, null, 2)}

已公开示例:
${JSON.stringify(publicData.data?.[0] || {}, null, 2)}`, 
                    pendingRes.ok && publicRes.ok ? 'success' : 'error');
            } catch (error) {
                showResult(`❌ 测试失败: ${error.message}`, 'error');
            }
        }

        function showResult(text, type) {
            const result = document.getElementById('result');
            result.textContent = text;
            result.className = `result ${type}`;
            result.style.display = 'block';
        }
    </script>
</body>
</html>
