version: '3.8'

services:
  hjzdm-app:
    build: .
    container_name: hjzdm-production
    ports:
      - "8080:80"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_USERNAME=2eXmMXiGeCt9iz7.root
      - SPRING_DATASOURCE_PASSWORD=FPpKFpms5hDXtOuF
      - SERVER_PORT=8080
      - REDIS_HOST=redis
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hjzdm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data: