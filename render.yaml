services:
  - type: web
    name: hjzdm-ecommerce
    env: docker
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    healthCheckTimeoutSeconds: 120
    autoDeploy: true
    envVars:
      - key: PORT
        value: 9090
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: RAKUTEN_APP_ID
        sync: false
      - key: RAKUTEN_APPLICATION_SECRET
        sync: false
      - key: RAKUTEN_AFFILIATE_ID
        sync: false
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_SECRET
        sync: false
      - key: JWT_USER_SECRET_KEY
        generateValue: true
      - key: UPLOAD_PATH
        value: /tmp/uploads