    envVars:
      - key: SERVER_PORT
        value: 9090
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
