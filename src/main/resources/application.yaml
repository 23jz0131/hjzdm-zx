server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hjzdm?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.wray.hjzdm: debug
    org.springframework.web: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 文件上传路径配置
file:
  upload-path: ${UPLOAD_PATH:./uploads/}



# JWT
jwt:
  user-secret-key: ${JWT_USER_SECRET_KEY:wray12121212asdhiashdikasbdiasgfiabgfkbaiwfgiwfawfafa}
  user-ttl: 172800000   # 2 天
  user-token-name: Authorization

features:
  rakuten:
    enabled: true

# MyBatis Plus
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:**/mapper/*.xml
  type-aliases-package: com.wray.hjzdm.entity
  global-config:
    banner: off

# Knife4j
knife4j:
  enable: true

