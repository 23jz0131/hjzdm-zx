server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/fortune500?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&requireSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true
    username: 2eXmMXiGeCt9iz7.root
    password: 00KpH8EmSBk7A3ET
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Druid连接池配置
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.wray.hjzdm: info
    org.springframework.web: info
    org.hibernate.SQL: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ./logs/application.log
    max-size: 10MB
    max-history: 30

# 文件上传路径配置
file:
  upload-path: ${UPLOAD_PATH:/app/uploads/}

# JWT
jwt:
  user-secret-key: ${JWT_USER_SECRET_KEY:wray12121212asdhiashdikasbdiasgfiabgfkbaiwfgiwfawfafa}
  user-ttl: 172800000   # 2 天
  user-token-name: Authorization

features:
  rakuten:
    enabled: true

# MyBatis Plus
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:**/mapper/*.xml
  type-aliases-package: com.wray.hjzdm.entity
  global-config:
    banner: off

# Knife4j
