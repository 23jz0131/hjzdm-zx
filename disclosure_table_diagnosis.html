<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投稿表结构诊断工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
        }
        .success {
            background: #e8f5e8;
            border: 2px solid #4caf50;
            color: #2e7d32;
        }
        .error {
            background: #ffebee;
            border: 2px solid #f44336;
            color: #c62828;
        }
        .info {
            background: #e3f2fd;
            border: 2px solid #2196f3;
            color: #1565c0;
        }
        .warning {
            background: #fff3e0;
            border: 2px solid #ff9800;
            color: #ef6c00;
        }
        .section {
            margin: 25px 0;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background: #fafafa;
        }
        .section h2 {
            color: #555;
            margin-top: 0;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 投稿表结构诊断工具</h1>
        <p style="text-align: center; color: #666; margin-bottom: 30px;">
            此工具将帮助诊断投稿审查页面无法显示数据的根本原因
        </p>
        
        <div class="section">
            <h2>📊 数据库表结构检查</h2>
            <button class="btn" onclick="checkTableStructure()">检查DISCLOSURE表结构</button>
            <button class="btn" onclick="checkAllTables()">查看所有数据表</button>
            <div id="structureResult" class="result" style="display: none;"></div>
        </div>
        
        <div class="section">
            <h2>📋 投稿数据检查</h2>
            <button class="btn" onclick="checkDisclosureData()">检查投稿数据</button>
            <button class="btn" onclick="createSampleData()">创建测试数据</button>
            <div id="dataResult" class="result" style="display: none;"></div>
        </div>
        
        <div class="section">
            <h2>🔧 系统连接测试</h2>
            <button class="btn" onclick="testBackendConnection()">测试后端连接</button>
            <button class="btn" onclick="testAdminLogin()">测试管理员登录</button>
            <div id="connectionResult" class="result" style="display: none;"></div>
        </div>
        
        <div class="section">
            <h2>💡 诊断建议</h2>
            <div id="diagnosisAdvice" class="result info">
根据检查结果，系统将提供针对性的解决方案建议。
可能的问题包括：
• DISCLOSURE表不存在
• 表结构不完整
• 数据库连接配置错误
• 权限不足
• 数据为空
            </div>
        </div>
    </div>

    <script>
        let authToken = '';

        async function showResult(elementId, content, type = 'info') {
            const element = document.getElementById(elementId);
            element.textContent = content;
            element.className = `result ${type}`;
            element.style.display = 'block';
        }

        async function checkTableStructure() {
            const resultDiv = document.getElementById('structureResult');
            resultDiv.innerHTML = '<div class="loading"></div> 正在检查表结构...';
            resultDiv.className = 'result info';
            resultDiv.style.display = 'block';
            
            try {
                // 通过后端API检查表结构
                const response = await fetch('http://localhost:9090/admin/check-table-structure', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showResult('structureResult', JSON.stringify(data, null, 2), 'success');
                } else {
                    // 如果专用接口不存在，尝试通过其他方式检查
                    await checkViaDisclosureApi();
                }
            } catch (error) {
                // 网络错误，尝试备用方案
                await checkViaDisclosureApi();
            }
        }

        async function checkViaDisclosureApi() {
            try {
                // 先登录获取token
                const loginResponse = await fetch('http://localhost:9090/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'testuser3', password: '123123' })
                });
                
                const loginData = await loginResponse.json();
                if (loginData.code === 200) {
                    authToken = loginData.data.token;
                    
                    // 尝试获取投稿数据来间接判断表是否存在
                    const disclosureResponse = await fetch('http://localhost:9090/disclosure/queryPublicList', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify({ pageNum: 1, pageSize: 1 })
                    });
                    
                    const disclosureData = await disclosureResponse.json();
                    
                    if (disclosureData.code === 200) {
                        showResult('structureResult', 
                            '✅ DISCLOSURE表存在且可访问\n' +
                            '📊 当前数据状态:\n' +
                            `   总数: ${disclosureData.data?.length || 0} 条\n` +
                            '✅ 表结构正常', 
                            'success');
                    } else {
                        showResult('structureResult', 
                            '❌ 无法访问DISCLOSURE表\n' +
                            `错误信息: ${disclosureData.msg || '未知错误'}\n` +
                            '🔧 建议: 检查数据库连接和表权限', 
                            'error');
                    }
                } else {
                    showResult('structureResult', 
                        '❌ 管理员登录失败\n' +
                        `错误信息: ${loginData.msg || '未知错误'}\n` +
                        '🔧 建议: 检查管理员账户配置', 
                        'error');
                }
            } catch (error) {
                showResult('structureResult', 
                    '❌ 连接后端服务失败\n' +
                    `错误信息: ${error.message}\n` +
                    '🔧 建议:\n' +
                    '1. 确认后端服务是否运行在9090端口\n' +
                    '2. 检查网络连接\n' +
                    '3. 确认数据库配置是否正确', 
                    'error');
            }
        }

        async function checkAllTables() {
            showResult('structureResult', '<div class="loading"></div> 正在获取所有表信息...', 'info');
            
            try {
                // 这里需要后端提供获取所有表的接口
                // 暂时显示提示信息
                showResult('structureResult', 
                    'ℹ️ 此功能需要后端支持\n' +
                    '建议在后端添加以下接口:\n\n' +
                    '@GetMapping("/admin/all-tables")\n' +
                    'public Result getAllTables() {\n' +
                    '    // 返回数据库中所有表名\n' +
                    '}', 
                    'warning');
            } catch (error) {
                showResult('structureResult', `错误: ${error.message}`, 'error');
            }
        }

        async function checkDisclosureData() {
            if (!authToken) {
                await testAdminLogin();
                if (!authToken) return;
            }
            
            showResult('dataResult', '<div class="loading"></div> 正在检查投稿数据...', 'info');
            
            try {
                const [pendingResponse, publicResponse] = await Promise.all([
                    fetch('http://localhost:9090/disclosure/queryPendingList', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify({ pageNum: 1, pageSize: 100 })
                    }),
                    fetch('http://localhost:9090/disclosure/queryPublicList', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify({ pageNum: 1, pageSize: 100 })
                    })
                ]);
                
                const pendingData = await pendingResponse.json();
                const publicData = await publicResponse.json();
                
                let result = '📊 投稿数据统计:\n\n';
                
                if (pendingData.code === 200) {
                    const pendingCount = pendingData.data?.length || 0;
                    result += `⏳ 待审核投稿: ${pendingCount} 条\n`;
                    if (pendingCount > 0) {
                        result += '   示例数据:\n';
                        pendingData.data.slice(0, 3).forEach((item, index) => {
                            result += `     ${index + 1}. "${item.title}" (ID: ${item.disclosureId})\n`;
                        });
                    }
                } else {
                    result += `❌ 待审核投稿接口错误: ${pendingData.msg || '未知错误'}\n`;
                }
                
                if (publicData.code === 200) {
                    const publicCount = publicData.data?.length || 0;
                    result += `\n✅ 已公开投稿: ${publicCount} 条\n`;
                    if (publicCount > 0) {
                        result += '   示例数据:\n';
                        publicData.data.slice(0, 3).forEach((item, index) => {
                            result += `     ${index + 1}. "${item.title}" (ID: ${item.disclosureId})\n`;
                        });
                    }
                } else {
                    result += `\n❌ 已公开投稿接口错误: ${publicData.msg || '未知错误'}\n`;
                }
                
                const totalCount = (pendingData.data?.length || 0) + (publicData.data?.length || 0);
                result += `\n📈 总计: ${totalCount} 条投稿`;
                
                if (totalCount === 0) {
                    result += '\n\n⚠️  数据库中暂无投稿数据\n建议创建测试数据进行验证';
                    showResult('dataResult', result, 'warning');
                } else {
                    showResult('dataResult', result, 'success');
                }
                
            } catch (error) {
                showResult('dataResult', `❌ 检查数据失败: ${error.message}`, 'error');
            }
        }

        async function createSampleData() {
            showResult('dataResult', '<div class="loading"></div> 正在创建测试数据...', 'info');
            
            try {
                // 使用普通用户创建投稿
                const userLogin = await fetch('http://localhost:9090/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'zhanghui', password: '123456' })
                });
                
                const userData = await userLogin.json();
                if (userData.code === 200) {
                    const userToken = userData.data.token;
                    
                    // 创建测试投稿
                    const sampleDisclosures = [
                        {
                            title: '测试投稿1 - iPhone优惠信息',
                            content: '发现苹果官方商店有特别优惠活动，iPhone 15系列降价10%',
                            link: 'https://www.apple.com',
                            disclosurePrice: 8999,
                            imgUrl: '/uploads/test1.jpg',
                            status: 0
                        },
                        {
                            title: '测试投稿2 - 游戏特价',
                            content: 'Steam平台本周特惠，多款热门游戏5折销售',
                            link: 'https://store.steampowered.com',
                            disclosurePrice: 299,
                            imgUrl: '/uploads/test2.jpg',
                            status: 1
                        }
                    ];
                    
                    let successCount = 0;
                    for (const disclosure of sampleDisclosures) {
                        const response = await fetch('http://localhost:9090/disclosure/add', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${userToken}`
                            },
                            body: JSON.stringify(disclosure)
                        });
                        
                        const result = await response.json();
                        if (result.code === 200) {
                            successCount++;
                        }
                    }
                    
                    showResult('dataResult', 
                        `✅ 成功创建 ${successCount} 条测试投稿\n` +
                        '请重新检查数据状态', 
                        'success');
                } else {
                    showResult('dataResult', `❌ 用户登录失败: ${userData.msg}`, 'error');
                }
            } catch (error) {
                showResult('dataResult', `❌ 创建测试数据失败: ${error.message}`, 'error');
            }
        }

        async function testBackendConnection() {
            showResult('connectionResult', '<div class="loading"></div> 正在测试后端连接...', 'info');
            
            try {
                const response = await fetch('http://localhost:9090/actuator/health');
                if (response.ok) {
                    showResult('connectionResult', '✅ 后端服务连接正常', 'success');
                } else {
                    showResult('connectionResult', '❌ 后端服务响应异常', 'error');
                }
            } catch (error) {
                showResult('connectionResult', 
                    '❌ 无法连接到后端服务\n' +
                    `错误信息: ${error.message}\n\n` +
                    '🔧 解决方案:\n' +
                    '1. 确认Spring Boot应用是否在运行\n' +
                    '2. 检查端口9090是否被占用\n' +
                    '3. 查看应用启动日志是否有错误', 
                    'error');
            }
        }

        async function testAdminLogin() {
            showResult('connectionResult', '<div class="loading"></div> 正在测试管理员登录...', 'info');
            
            try {
                const response = await fetch('http://localhost:9090/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'testuser3', password: '123123' })
                });
                
                const data = await response.json();
                if (data.code === 200) {
                    authToken = data.data.token;
                    showResult('connectionResult', 
                        '✅ 管理员登录成功\n' +
                        `用户ID: ${data.data.id}\n` +
                        `用户名: ${data.data.name}`, 
                        'success');
                } else {
                    showResult('connectionResult', 
                        '❌ 管理员登录失败\n' +
                        `错误信息: ${data.msg || '未知错误'}\n\n` +
                        '🔧 解决方案:\n' +
                        '1. 确认管理员账户testuser3是否存在\n' +
                        '2. 检查密码是否正确\n' +
                        '3. 确认用户具有管理员权限', 
                        'error');
                }
            } catch (error) {
                showResult('connectionResult', `❌ 登录请求失败: ${error.message}`, 'error');
            }
        }

        // 页面加载完成后自动进行基础检查
        window.addEventListener('load', function() {
            setTimeout(testBackendConnection, 1000);
        });
    </script>
</body>
</html>
